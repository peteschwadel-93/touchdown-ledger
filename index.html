<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Touchdown Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column of soft dark cards under pill tabs, same system as the Tip-Off Ledger. Single dark theme by design:
   night-game charcoal with a green cast, goalpost yellow for headings, numbers and controls, teal reserved for scores and wins. */
:root{
  --bg:#0f1311; --surface:#171c19; --raise:#1f2622; --sunk:#262e29; --ink:#e6ebe4; --soft:#c2cabf; --muted:#8a958b; --line:#28302b;
  --accent:#f2c230; --accent-soft:#3a3110; --accent-ink:#17150a; --made:#63d2b4; --made-soft:#17352e; --miss:#c98d84; --warn:#f0914a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1760px;margin:0 auto;padding-inline:24px;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.topr{display:flex;align-items:center;gap:22px}
.logo{width:72px;height:72px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(242,194,48,.35),0 0 26px 6px rgba(242,194,48,.4),0 0 70px 18px rgba(242,194,48,.16)}
h1{font:700 46px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:8px 0 0;letter-spacing:.02em}
.fresh{font:400 12px/1.5 var(--mono);color:var(--muted);text-align:right}
.refresh{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{font:600 13px var(--body);color:var(--accent-ink);background:var(--accent);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
h2{font:600 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance;color:var(--accent)}
h3{font:500 11.5px/1.2 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
.bar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:600 16px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--soft);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer}
.tabs button:hover{background:var(--raise)}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.seg button{font:500 13px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
label.f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
select,input[type=search],input[type=text],input[type=password],textarea{font:500 14px var(--body);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
textarea{font:400 12px/1.4 var(--mono);width:100%;min-height:90px;resize:vertical}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,tr[tabindex]:focus-visible,th[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.grid2>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.phead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.note{color:var(--muted);font-size:13.5px;margin:0;line-height:1.6;max-width:95ch}
.note b{color:var(--soft);font-weight:500}
.tw{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 14px;text-align:left;white-space:nowrap}
th{font:500 11px/1.2 var(--body);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);vertical-align:bottom;border-bottom:1px solid var(--line);padding-block:12px}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr:nth-child(odd)>td{background:color-mix(in srgb,var(--surface) 55%,transparent)}
th[tabindex]{cursor:pointer}th[tabindex]:hover{color:var(--ink)}
th[aria-sort]{color:var(--accent)}th[aria-sort]:after{content:" ▾"}th[aria-sort="ascending"]:after{content:" ▴"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{color:var(--soft)}
td.k,th.k{background:rgba(255,255,255,.035)}
tr.pick{cursor:pointer}tr.pick:hover>td{background:var(--raise)}
tbody tr.on>td{background:var(--accent-soft)}
tbody tr.det>td{background:var(--bg);white-space:normal;padding:18px}
.tm{font:600 16px var(--display);letter-spacing:.07em}
.pn{font-weight:500}
.o{color:var(--muted)}
.meter{display:inline-block;width:56px;height:6px;background:var(--sunk);border-radius:999px;vertical-align:middle;margin-left:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.tag{display:inline-block;font:600 10.5px/1 var(--body);letter-spacing:.07em;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;text-transform:uppercase}
.tag.w{background:var(--made-soft);border-color:transparent;color:var(--made)}.tag.l{color:var(--miss)}
.tag.q{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.tag.pos{min-width:34px;text-align:center}
.ev{font-weight:600;font-variant-numeric:tabular-nums}
.ev.p1{color:#9fdc58}.ev.p2{color:#3ef07f}.ev.p0{color:var(--soft)}.ev.neg{color:var(--muted);font-weight:400}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.rcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rcard.lead{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px -18px var(--accent)}
.rcard h3{color:var(--accent);font:600 20px/1 var(--display);letter-spacing:.06em}
.rcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.rcard ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:s}
.rcard li{counter-increment:s;display:grid;grid-template-columns:1.4em minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;padding:9px 0;cursor:pointer}
.rcard li+li{border-top:1px solid var(--line)}
.rcard li:before{content:counter(s);color:var(--accent);font-weight:600}
.rcard li:hover .rn{color:var(--accent)}
.rn{font:600 18px/1.15 var(--display);text-transform:uppercase;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{font:600 15px var(--body);font-variant-numeric:tabular-nums;text-align:right}
.rs{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13.5px;color:var(--muted);align-items:baseline}
.kv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:6px 0;margin:0}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 28px}
.calc>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.eq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 14px;font-size:13.5px;color:var(--soft)}
.eq b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.eq .tot{border-top:1px solid var(--line);padding-top:6px;color:var(--accent)}
.eq b.tot{color:var(--accent);font-weight:600}
.mini td,.mini th{padding:6px 10px;font-size:13px}
.price{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.price input{width:110px}
.matchhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px 24px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.side{display:flex;flex-direction:column;gap:4px;min-width:0}.side.r{text-align:right;align-items:flex-end}
.big{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.who{font:600 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.mid{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.mid b{display:block;font:700 26px/1 var(--display);color:var(--ink)}
.bars{display:grid;grid-template-columns:minmax(0,auto) minmax(60px,1fr) auto;gap:9px 14px;align-items:center;font-size:13.5px;color:var(--soft);max-width:760px}
.bars .track{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bars .v{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.bars .lead{color:var(--accent);font-weight:500}
svg text{font:400 11px var(--mono);fill:var(--muted)}
details.how{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:14px 18px}
details.how summary{cursor:pointer;font-weight:500;color:var(--soft)}
details.how[open] summary{margin-bottom:12px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--soft);font-size:13.5px;line-height:1.6;max-width:90ch}
code{font:400 12.5px var(--mono);background:var(--sunk);padding:2px 6px;border-radius:6px;color:var(--ink);overflow-wrap:anywhere}
.tip{position:fixed;pointer-events:none;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink);z-index:5}
@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.wrap{padding-inline:16px}h1{font-size:36px}.logo{width:52px;height:52px}.topr{width:100%;justify-content:space-between}.refresh{align-items:flex-start}.fresh{text-align:left}.panel{padding:16px}.matchhead{grid-template-columns:1fr 1fr}.mid{grid-column:1/3;grid-row:2}.big{font-size:34px}}
</style>

  <header class="top">

    </div>

      <div class="refresh">
        <div class="fresh" id="fresh">Loading…</div>
        <button class="btn" id="refreshBtn" hidden>Refresh games and prices</button>

<script id="atd-data" type="application/json"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var D=null,served=/^https?:$/.test(location.protocol)&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
var S={tab:"picks",wk:null,sort:"value",pos:"all",game:"all",book:"best",minp:0.1,priced:0,open:null,gsel:null,pseason:null,ppos:"all",pq:"",psort:[10,-1],tview:"off",tseason:null,tsort:{off:[1,-1],def:[1,-1]},twk:0,pk:{}};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var MAN=ls("atd-manual")||{},PASTE=ls("atd-paste")||{};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pct(x,d){return x==null?"–":(x*100).toFixed(d==null?0:d)+"%"}
function f2(x,d){return x==null?"–":Number(x).toFixed(d==null?2:d)}
function norm(s){return String(s).normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[.'’`]/g,"").replace(/\b(jr|sr|ii|iii|iv|v)\b/g,"").replace(/[^a-z]+/g," ").trim()}
/* prices */
function dec(a){return a>0?1+a/100:1+100/Math.abs(a)}
function amer(p){if(p==null||p<=0||p>=1)return"–";var a=p>=0.5?-100*p/(1-p):100*(1-p)/p;a=Math.round(a);return(a>0?"+":"")+a}
function fmtA(a){return a==null?"–":(a>0?"+":"")+a}
var IDX={};
function oddsFor(gid){
  if(IDX[gid])return IDX[gid];
  var rec=(D.odds||{})[gid],pr=PASTE[gid],out={at:null,by:{},books:[]};
  [rec,pr].forEach(function(r){if(!r||!r.b)return;if(!out.at||r.at>out.at)out.at=r.at;
    Object.keys(r.b).forEach(function(bk){if(out.books.indexOf(bk)<0)out.books.push(bk);r.b[bk].forEach(function(x){var k=norm(x[0]);(out.by[k]=out.by[k]||{})[bk]=x[1]})})});
  return IDX[gid]=out}
function allBooks(){var s={};D.sched.forEach(function(g){oddsFor(g.gid).books.forEach(function(b){s[b]=1})});return Object.keys(s).sort()}
function priceOf(r){
  var m=MAN[r.g+"|"+r.id];if(m!=null)return{a:m,bk:"Your price"};
  var by=oddsFor(r.g).by[norm(r.n)];if(!by)return null;
  if(S.book!=="best")return by[S.book]!=null?{a:by[S.book],bk:S.book}:null;
  var best=null;Object.keys(by).forEach(function(b){if(!best||dec(by[b])>dec(best.a))best={a:by[b],bk:b,n:Object.keys(by).length}});return best}
function calc(r){var pr=priceOf(r);r._pr=pr;if(pr){var d=dec(pr.a);r._imp=1/d;r._ev=r.p*d-1;r._k=r._ev/(d-1)}else{r._imp=r._ev=r._k=null}return r}
function evCls(e){return e==null?"":e>=0.15?"p2":e>=0.03?"p1":e>=0?"p0":"neg"}
function evTxt(e){return e==null?"–":(e>=0?"+":"")+(e*100).toFixed(0)+"%"}
function gm(gid){for(var i=0;i<D.sched.length;i++)if(D.sched[i].gid===gid)return D.sched[i]}
function injTag(r){var t="";if(r.inj&&r.inj[0])t+=' <span class="tag q" title="'+esc(r.inj[1]+(r.inj[2]?" · "+r.inj[2]:""))+'">'+esc(r.inj[0].slice(0,1))+"</span>";
  if(r.back)t+=' <span class="tag q" title="No snaps in the team\'s last two games">Back?</span>';return t}
function vsTxt(r){var g=gm(r.g);return (g&&g.h===r.t?"vs ":"@ ")+r.o}
function meter(p,max){return '<span class="meter"><i style="width:'+Math.min(100,p/(max||0.65)*100).toFixed(0)+'%"></i></span>'}
function seg(id,opts,cur){return '<span class="seg" id="'+id+'">'+opts.map(function(o){return '<button data-v="'+esc(o[0])+'" aria-pressed="'+(String(o[0])===String(cur))+'">'+esc(o[1])+"</button>"}).join("")+"</span>"}
function weeks(){var w=[];D.sched.forEach(function(g){if(w.indexOf(g.wk)<0)w.push(g.wk)});return w}
function pool(){return D.picks.filter(function(r){var g=gm(r.g);return g&&g.wk===S.wk}).map(calc)}

/* ---------- Picks ---------- */
function topCard(title,blurb,rows,val,sub,lead,emptyMsg){
  var h='<div class="rcard'+(lead?" lead":"")+'"><h3>'+title+"</h3><p>"+blurb+"</p>";
  if(!rows.length)return h+'<p class="empty">'+emptyMsg+"</p></div>";
  return h+"<ol>"+rows.map(function(r){return '<li data-open="'+esc(r.g+"|"+r.id)+'"><span class="rn">'+esc(r.n)+'</span><span class="rv">'+val(r)+'</span><span class="rs">'+esc(r.t)+" "+vsTxt(r)+" · "+sub(r)+injTag(r)+"</span></li>"}).join("")+"</ol></div>"}
function priceHelp(){
  var meta=(D.odds||{})._meta||{},h='<details class="how" id="how"'+(S.howOpen?" open":"")+'><summary>Where prices come from</summary><ol class="steps">';
  h+="<li><b>Automatic.</b> On the GitHub copy of this page, prices arrive by themselves: each game is priced the day before, three hours before and one hour before kickoff, using the Odds API key saved in the repository's secrets."+(meta.key===0?" <b>No key was found on the last build</b>, so add the ODDS_API_KEY secret.":"")+"</li>";
  if(served)h+='<li><form class="price" id="keyForm"><label for="keyIn">Odds API key</label><input type="password" id="keyIn" autocomplete="off" placeholder="'+(meta.key?"saved — paste to replace":"paste your key")+'"><button class="btn" type="submit">Save key and pull prices</button></form></li>';
  h+='<li><b>Paste.</b> Open <code>https://api.the-odds-api.com/v4/sports/americanfootball_nfl/events/EVENT_ID/odds?apiKey=YOUR_KEY&amp;regions=us&amp;markets=player_anytime_td&amp;oddsFormat=american</code> in a browser tab, copy the whole response and paste it here. The game is matched from the team names.<br><textarea id="pasteBox" aria-label="Odds API response" placeholder="{&quot;id&quot;:&quot;…&quot;,&quot;home_team&quot;:&quot;…&quot;,&quot;bookmakers&quot;:[…]}"></textarea><span class="price"><button class="btn ghost" id="pasteBtn" type="button">Add pasted prices</button><span class="o" id="pasteMsg" role="status"></span></span></li>';
  h+="<li><b>By hand.</b> Open any player row and type the price you see at your book. It is kept in this browser.</li></ol></details>";return h}
function vPicks(){
  var rows=pool(),priced=rows.filter(function(r){return r._pr}),games=D.sched.filter(function(g){return g.wk===S.wk});
  var withP=games.filter(function(g){return oddsFor(g.gid).books.length}).length,meta=(D.odds||{})._meta||{};
  var elig=priced.filter(function(r){return r.p>=S.minp});
  var byV=elig.filter(function(r){return r._ev>0}).sort(function(a,b){return b._ev-a._ev}).slice(0,6);
  var byK=elig.filter(function(r){return r._k>0}).sort(function(a,b){return b._k-a._k}).slice(0,6);
  var byP=rows.slice().sort(function(a,b){return b.p-a.p}).slice(0,6);
  var none=priced.length?"No player at "+pct(S.minp)+"+ beats his price right now. Books take 25–45% out of this market, so empty is normal.":"Shows up once prices are loaded. Until then, compare the fair price column to your book.";
  var h='<section class="panel"><div class="phead"><h2>Week '+S.wk+" picks</h2><div class=\"filters\">"+
    (weeks().length>1?'<label class="f">Week '+seg("seg-wk",weeks().map(function(w){return[w,"Week "+w]}),S.wk)+"</label>":"")+
    '<label class="f">Floor '+seg("seg-minp",[[0,"Any"],[0.1,"10%+"],[0.2,"20%+"],[0.3,"30%+"]],S.minp)+"</label></div></div>";
  h+='<p class="note">'+(withP?"<b>Prices loaded for "+withP+" of "+games.length+" games.</b> ":"<b>No sportsbook prices loaded yet.</b> The model's chance and fair price are live for every player; edge appears once a price is in. ")+
    "Value is the expected return per $1 at the best price found. Blend is the Kelly stake, which rewards an edge more when the bet is likelier to land."+(meta.left!=null?" Odds API requests left: <b>"+meta.left+"</b>.":"")+(meta.err?" Last price pull failed: "+esc(meta.err)+".":"")+"</p>";
  h+='<div class="rcards">'+
    topCard("Best value","Highest expected return, players at "+pct(S.minp)+"+ only.",byV,function(r){return '<span class="ev '+evCls(r._ev)+'">'+evTxt(r._ev)+"</span>"},function(r){return fmtA(r._pr.a)+" "+esc(r._pr.bk)+" · model "+pct(r.p)+" · fair "+amer(r.p)},true,none)+
    topCard("Best blend","Value weighted by likelihood (Kelly stake).",byK,function(r){return (r._k*100).toFixed(1)+"%"},function(r){return fmtA(r._pr.a)+" · model "+pct(r.p)+" · edge "+evTxt(r._ev)},false,none)+
    topCard("Most likely","Highest chance to score, price ignored.",byP,function(r){return pct(r.p)},function(r){return "fair "+amer(r.p)+(r._pr?" · best "+fmtA(r._pr.a)+" · edge "+evTxt(r._ev):"")},false,"")+"</div>";
  h+=priceHelp()+"</section>";
  /* board */
  var books=allBooks();
  var list=rows.filter(function(r){return (S.pos==="all"||r.pos===S.pos)&&(S.game==="all"||r.g===S.game)&&r.p>=S.minp&&(!S.priced||r._pr)});
  var key={value:function(r){return r._ev==null?-9:r._ev},blend:function(r){return r._k==null?-9:r._k},likely:function(r){return r.p}}[S.sort];
  list.sort(function(a,b){return key(b)-key(a)||b.p-a.p});
  h+='<section class="panel"><div class="phead"><h2>The board</h2><div class="filters">'+
    '<label class="f">Rank by '+seg("seg-sort",[["value","Value"],["blend","Blend"],["likely","Likelihood"]],S.sort)+"</label>"+
    '<label class="f">Position '+seg("seg-pos",[["all","All"],["RB","RB"],["WR","WR"],["TE","TE"],["QB","QB"]],S.pos)+"</label>"+
    '<label class="f" for="selGame">Game <select id="selGame"><option value="all">All games</option>'+games.map(function(g){return '<option value="'+g.gid+'"'+(S.game===g.gid?" selected":"")+">"+g.a+" @ "+g.h+"</option>"}).join("")+"</select></label>"+
    (books.length?'<label class="f" for="selBook">Book <select id="selBook"><option value="best">Best price</option>'+books.map(function(b){return '<option'+(S.book===b?" selected":"")+">"+esc(b)+"</option>"}).join("")+"</select></label>"+
    '<label class="f">Show '+seg("seg-priced",[[0,"All"],[1,"Priced"]],S.priced)+"</label>":"")+"</div></div>";

    h+='<div class="grid2">'+recTable("By edge at the stored price",[[0.5,99],[0.25,0.5],[0.1,0.25],[0.03,0.1],[-0.03,0.03],[-0.15,-0.03],[-9,-0.15]],pr,function(b){return b.e},function(b){return b[0]<-1?"Worse than −15%":b[1]>9?"+50% and up":(b[0]>=0?"+":"")+Math.round(b[0]*100)+"% to "+(b[1]>0?"+":"")+Math.round(b[1]*100)+"%"})+
      recTable("Value picks by model chance",[[0.4,1],[0.3,0.4],[0.2,0.3],[0.1,0.2],[0.08,0.1]],val,function(b){return b.r[7]},function(b){return Math.round(b[0]*100)+"–"+Math.round(b[1]*100)+"%"})+"</div>"+
      '<div class="grid2">'+recTable("Value picks by position",[["RB"],["WR"],["TE"],["QB"]].map(function(x,i){return[i,i+1,x[0]]}),val,function(b){return["RB","WR","TE","QB"].indexOf(b.r[6])},function(b){return b[2]})+
      recTable("Value picks by price",[[-9999,100],[100,200],[200,400],[400,800],[800,99999]],val,function(b){return b.a},function(b){return b[0]<0?"Odds-on":b[1]>9999?"+800 and longer":"+"+b[0]+" to +"+b[1]})+"</div>";
    h+='<p class="note">Look for rows that stay green as games pile up; that is where a betting rule comes from. A row needs a few hundred bets before its return means much. The best price across books flatters the result a little if you only bet at one book.</p>';
    var lst=val.slice().sort(function(a,b){return b.r[1]-a.r[1]||b.e-a.e});
    h+='<h3>Value picks, newest first</h3><div class="tw"><table><thead><tr><th>Wk</th><th>Player</th><th>Game</th><th class="n">Model</th><th class="n">Price</th><th class="n">Edge</th><th>Result</th><th class="n">Units</th></tr></thead><tbody>'+lst.slice(0,300).map(function(b){var r=b.r;return "<tr><td>"+wkLab(r[0],r[1])+'</td><td><span class="tag pos">'+r[6]+'</span> <span class="pn">'+esc(r[3])+'</span></td><td><span class="tm">'+r[4]+'</span> <span class="o">v '+r[5]+'</span></td><td class="n">'+pct(r[7],1)+'</td><td class="n">'+fmtA(b.a)+' <span class="o">'+esc(b.bk||"")+'</span></td><td class="n"><span class="ev '+evCls(b.e)+'">'+evTxt(b.e)+"</span></td><td>"+(r[8]?'<span class="tag w">Scored'+(r[9]>1?" ×"+r[9]:"")+"</span>":'<span class="tag l">No TD</span>')+'</td><td class="n">'+(b.pl>=0?"+":"")+f2(b.pl)+"</td></tr>"}).join("")+"</tbody></table></div>"+(lst.length>300?'<p class="note">Showing 300 of '+lst.length+". Pick a week to see the rest.</p>":"")}
  else h+='<p class="note"><b>No stored prices for '+(S.twk?"this week":S.tseason)+" yet.</b> Load them once from Actions → Update → Run workflow, choosing which seasons under past prices.</p>";
  var top=rows.slice().sort(function(a,b){return b[1]-a[1]||b[7]-a[7]}).filter(function(r){return r[7]>=0.3});
  h+='<h3>Players the model had at 30% or better</h3><div class="tw"><table><thead><tr><th>Wk</th><th>Player</th><th>Game</th><th class="n">Model</th><th class="n">Fair</th><th class="n">Stored price</th><th>Result</th></tr></thead><tbody>'+top.slice(0,200).map(function(r){var sp=storedPrice(r);return "<tr><td>"+wkLab(r[0],r[1])+'</td><td><span class="tag pos">'+r[6]+'</span> <span class="pn">'+esc(r[3])+'</span></td><td><span class="tm">'+r[4]+'</span> <span class="o">v '+r[5]+'</span></td><td class="n">'+pct(r[7],1)+'</td><td class="n">'+amer(r[7])+'</td><td class="n">'+(sp?fmtA(sp[0]):"–")+"</td><td>"+(r[8]?'<span class="tag w">Scored'+(r[9]>1?" ×"+r[9]:"")+"</span>":'<span class="tag l">No TD</span>')+"</td></tr>"}).join("")+"</tbody></table></div>"+(top.length>200?'<p class="note">Showing 200 of '+top.length+". Pick a week to see the rest.</p>":"")+"</section>";
  return h}

/* ---------- Model ---------- */
function calChart(cal){
  var W=420,H=300,l=44,b=34,t=12,r=14,mx=0.65,x=function(v){return l+v/mx*(W-l-r)},y=function(v){return H-b-v/mx*(H-t-b)},s='<svg viewBox="0 0 '+W+" "+H+'" width="'+W+'" style="max-width:100%;height:auto" role="img" aria-label="Predicted chance against actual scoring rate">';
  [0,0.2,0.4,0.6].forEach(function(v){s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(l-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+pct(v)+'</text><text x="'+x(v)+'" y="'+(H-b+18)+'" text-anchor="middle">'+pct(v)+"</text>"});
  s+='<line x1="'+x(0)+'" y1="'+y(0)+'" x2="'+x(mx)+'" y2="'+y(mx)+'" stroke="var(--muted)" stroke-dasharray="4 4"/>';
  s+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+cal.map(function(c){return x(c[0])+","+y(c[1])}).join(" ")+'"/>';
  cal.forEach(function(c){s+='<circle cx="'+x(c[0])+'" cy="'+y(c[1])+'" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2" data-tip="Model '+pct(c[0],1)+" · scored "+pct(c[1],1)+" · "+c[2]+' player-games"/><circle cx="'+x(c[0])+'" cy="'+y(c[1])+'" r="14" fill="transparent" data-tip="Model '+pct(c[0],1)+" · scored "+pct(c[1],1)+" · "+c[2]+' player-games"/>'});
  return s+'<text x="'+(W-r)+'" y="'+(H-4)+'" text-anchor="end">model chance →</text><text x="'+l+'" y="'+(t+2)+'">↑ actually scored</text></svg>'}
function bars(rows,fmt,max,lead){return '<div class="bars">'+rows.map(function(r){return '<span'+(r[0]===lead?' class="lead"':"")+">"+esc(r[0])+'</span><span class="track" data-tip="'+esc(r[0])+": "+fmt(r[1])+'"><i style="width:'+Math.max(1,r[1]/max*100).toFixed(1)+'%"></i></span><span class="v">'+fmt(r[1])+"</span>"}).join("")+"</div>"}
function vModel(){
  var m=D.model,bt=m.bt,w=m.w,h='<section class="panel"><h2>How a chance is built</h2><ol class="steps">'+
   "<li><b>Team touchdowns.</b> The spread and total give each team an implied score. Offensive touchdowns per game = "+m.tfit[0]+" + "+m.tfit[1]+" × implied points.</li>"+
   "<li><b>Run or pass.</b> Those touchdowns are split by how the offence creates its chances (expected rushing vs receiving TDs, recent games weighted most), nudged lightly by what the opposing defence allows.</li>"+
   "<li><b>Who gets them.</b> Every carry and target is worth the league scoring rate from that spot: a carry from the 1 is worth 0.57 of a touchdown, a target from midfield almost nothing. A player's share of his team's total is his share of the chances. Recent games count most (weight halves every "+m.hl+" games). Shares are re-split over the players expected to dress, so an injured starter's chances move to his teammates.</li>"+
   "<li><b>Chance.</b> Expected TDs go through one fitted curve with position and snap share: logistic("+w[0]+" + "+w[1]+" × ln(expected TDs) "+(w[2]<0?"− ":"+ ")+Math.abs(w[2])+" if QB + "+w[3]+" if RB + "+w[4]+" if TE + "+w[5]+" × snap share). Fitted on "+m.n.toLocaleString()+" player-games.</li>"+
   "<li><b>Value.</b> Edge = chance × decimal price − 1. Blend = edge ÷ (decimal price − 1), the Kelly stake.</li></ol></section>";
  if(bt){
    h+='<div class="grid2"><section class="panel"><h2>Does it hold up?</h2><p class="note">Fitted on seasons before '+bt.season+", then scored on all "+bt.model.n.toLocaleString()+" player-games of "+bt.season+" it had never seen. When it says 30%, players score about 30% of the time.</p>"+calChart(bt.cal)+
      '<div class="tw"><table class="mini"><thead><tr><th>'+bt.season+' holdout</th><th class="n" title="Lower is better">Log loss</th><th class="n" title="Lower is better">Brier</th><th class="n" title="How well it ranks scorers above non-scorers; 0.5 is a coin flip">AUC</th></tr></thead><tbody>'+[["This model",bt.model],["Position average only",bt.posbase],["League average only",bt.base]].map(function(x){return "<tr><td>"+x[0]+'</td><td class="n">'+x[1].ll+'</td><td class="n">'+x[1].brier+'</td><td class="n">'+(x[0]==="League average only"?"0.500":x[1].auc)+"</td></tr>"}).join("")+"</tbody></table></div>"+
      '<div class="tw"><table class="mini"><thead><tr><th>Position</th><th class="n">Model avg</th><th class="n">Scored</th><th class="n">Player-games</th></tr></thead><tbody>'+["RB","WR","TE","QB"].map(function(p){var x=bt.bypos[p];return x?"<tr><td>"+p+'</td><td class="n">'+pct(x[0],1)+'</td><td class="n">'+pct(x[1],1)+'</td><td class="n">'+x[2]+"</td></tr>":""}).join("")+"</tbody></table></div></section>";
    h+='<section class="panel"><h2>What predicts a touchdown</h2><p class="note">Each input on its own, ranked by how well it sorted scorers from non-scorers in '+bt.season+" (0.50 is a coin flip). Field-position-weighted chances beat raw touchdowns, and goal-line carries or end-zone targets alone are too rare to rank a whole slate. They matter through the weighted total.</p>"+bars(bt.singles.map(function(s){return[s[0].replace(" (carries and targets weighted by field position)",""),s[1]]}),function(v){return v.toFixed(3)},0.8,"Full model")+
      '<h3>Tested and left out</h3><ol class="steps"><li><b>Finishing skill</b> (TDs above expected): no gain. A hot streak is mostly luck, which is why the Players tab shows it as a regression flag.</li><li><b>Defence funnel</b>: almost no gain once the betting total is in. Kept as a small nudge.</li><li><b>Wind 15+ mph</b>, home field, dome: no reliable gain.</li><li><b>Gradient boosting on every input</b>: 0.3978 → 0.3966 log loss blended. Not worth losing a formula you can read.</li></ol></section></div>'}
  var mxr=0.6;
  h+='<div class="grid2"><section class="panel"><h2>Carry value by yard line</h2><p class="note">Share of carries from each spot that score. This is the weight every carry gets.</p>'+bars(m.rush.map(function(r){var lab={13:"11–15",18:"16–20",25:"21–30",40:"31–50",75:"51+"}[r[0]]||String(r[0]);return[lab+" yd",r[1]]}),function(v){return pct(v,1)},mxr)+"</section>";
  var tl={3:"1–5",8:"6–10",15:"11–20",30:"21–40",70:"41+"};
  h+='<section class="panel"><h2>Target value by yard line</h2><p class="note">Targets thrown into the end zone score far more often than targets short of it from the same spot.</p><h3>Thrown into the end zone</h3>'+bars(m.tgt.filter(function(r){return r[0]===1}).map(function(r){return[tl[r[1]]+" yd",r[2]]}),function(v){return pct(v,1)},mxr)+"<h3>Short of the end zone</h3>"+bars(m.tgt.filter(function(r){return r[0]===0}).map(function(r){return[tl[r[1]]+" yd",r[2]]}),function(v){return pct(v,1)},mxr)+"</section></div>";
  h+='<section class="panel"><h2>Limits</h2><ol class="steps"><li><b>Value is only as proven as the Tracker shows.</b> The chances are tested on a full unseen season. Whether the edges make money depends on stored prices, graded on the Tracker tab; trust a row there only after a few hundred bets.</li><li><b>The model sees usage, not news.</b> A new starter, a snap count or a changed role shows up only after a game is played. Large edges on players in changing roles are usually the book being right.</li><li><b>Books keep 25–45% of this market</b> on the yes side, so most players are bad bets. A short list is the expected result.</li><li><b>First-TD prices</b> are each player\'s slice of all scoring in the game ('+pct(m.fcov)+" of first TDs go to listed skill players). They run slightly low for the top options: players given 14% won 16%.</li><li>Lines are the spread and total in the schedule file, refreshed on each build. Weather is not in the model.</li></ol></section>";
  return h}

/* ---------- shell ---------- */
var V={picks:vPicks,games:vGames,players:vPlayers,teams:vTeams,tracker:vTracker,model:vModel};
function render(keep){
  var y=window.scrollY,ae=document.activeElement&&document.activeElement.id,pos=ae==="pq"?$("pq").selectionStart:null;
  Array.prototype.forEach.call($("tabs").children,function(b){b.setAttribute("aria-selected",b.dataset.tab===S.tab)});
  $("view").innerHTML=V[S.tab]();
  if(keep)window.scrollTo(0,y);
  if(ae==="pq"&&$("pq")){$("pq").focus();$("pq").setSelectionRange(pos,pos)}}
function say(t){$("refreshMsg").hidden=!t;$("refreshMsg").textContent=t||""}
function start(d){
  D=d;IDX={};var w=weeks();if(S.wk==null||w.indexOf(S.wk)<0)S.wk=w[0];
  var b=new Date(d.built);$("fresh").textContent="Games through "+d.through+" · built "+b.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  render(true)}
function post(path,body,btn,label){
  btn.disabled=true;var old=btn.textContent;btn.textContent=label;
  return fetch(path,{method:"POST",body:body||""}).then(function(r){return r.json()}).then(function(d){if(d.error){say("Not refreshed: "+d.error+".");return}start(d);say("Up to date.")})
    .catch(function(){say("The local helper did not answer. Start build_data.py --serve again.")}).then(function(){btn.disabled=false;btn.textContent=old})}
function setSort(cur,i){return cur[0]===i?[i,-cur[1]]:[i,i===0?1:-1]}
document.addEventListener("click",function(e){
  var t=e.target,b;
  if((b=t.closest("#tabs button"))){S.tab=b.dataset.tab;S.open=null;try{history.replaceState(null,"","#"+S.tab)}catch(x){}render();return}
  if((b=t.closest(".seg button"))){var id=b.parentNode.id,v=b.dataset.v;
    ({"seg-wk":function(){S.wk=+v;S.game="all";S.open=null},"seg-minp":function(){S.minp=+v},"seg-sort":function(){S.sort=v},"seg-pos":function(){S.pos=v},"seg-priced":function(){S.priced=+v},"seg-ps":function(){S.pseason=v},"seg-pp":function(){S.ppos=v},"seg-tv":function(){S.tview=v},"seg-tss":function(){S.tseason=+v;S.twk=0}}[id]||function(){})();render(true);return}
  if(t.closest("[data-clear]")){var f=t.closest("form");delete MAN[f.dataset.price];ls("atd-manual",MAN);render(true);return}
  if(t.closest("#pasteBtn")){paste();return}
  if(t.closest("form,input,textarea,select,details.how,.det"))return;
  if((b=t.closest("th[data-ps]"))){S.psort=setSort(S.psort,+b.dataset.ps);render(true);return}
  if((b=t.closest("th[data-ts]"))){S.tsort[S.tview]=setSort(S.tsort[S.tview],+b.dataset.ts);render(true);return}
  if((b=t.closest("[data-open]"))){var id2=b.dataset.open;
    if(b.tagName==="LI"){S.open=id2;S.game=id2.split("|")[0];S.minp=0;S.pos="all";S.priced=0;render(true);var row=document.querySelector('tr.pick.on');if(row)row.scrollIntoView({block:"center"});return}
    S.open=S.open===id2?null:id2;render(true)}
});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr.pick,th[tabindex]")){e.preventDefault();e.target.click()}});
document.addEventListener("change",function(e){var t=e.target;
  if(t.id==="selGame"){S.game=t.value;S.open=null;render(true)}else if(t.id==="selBook"){S.book=t.value;render(true)}else if(t.id==="selG"){S.gsel=t.value;S.open=null;render(true)}else if(t.id==="selTw"){S.twk=+t.value;render(true)}});
document.addEventListener("input",function(e){if(e.target.id==="pq"){S.pq=e.target.value;render(true)}});
document.addEventListener("toggle",function(e){if(e.target.id==="how")S.howOpen=e.target.open},true);
document.addEventListener("submit",function(e){e.preventDefault();var f=e.target;
  if(f.dataset.price){var v=f.querySelector("input").value.trim().replace(/^\+/,""),a=parseInt(v,10);
    if(!v){delete MAN[f.dataset.price]}else if(isNaN(a)||Math.abs(a)<100){f.querySelector("input").setCustomValidity("Use American odds, like +140 or -120");f.querySelector("input").reportValidity();return}else MAN[f.dataset.price]=a;
    ls("atd-manual",MAN);render(true)}
  else if(f.id==="keyForm"){var k=$("keyIn").value.trim();if(k)post("/key",k,f.querySelector("button"),"Pulling prices…")}});
function paste(){
  var msg=$("pasteMsg"),doc;try{doc=JSON.parse($("pasteBox").value)}catch(x){msg.textContent="That is not valid JSON. Copy the whole response.";return}
  var g=null;D.sched.forEach(function(s){var a=norm(doc.away_team||""),h=norm(doc.home_team||"");if(D.names&&0){}if(TEAMS[a]===s.a&&TEAMS[h]===s.h)g=s});
  if(!g){msg.textContent="Could not match that response to a listed game.";return}
  var books={},n=0;(doc.bookmakers||[]).forEach(function(bk){(bk.markets||[]).forEach(function(mk){if(mk.key!=="player_anytime_td")return;var rows=[];(mk.outcomes||[]).forEach(function(o){var who=o.description||o.name;if(!who||o.name==="No"||typeof o.price!=="number")return;rows.push([who,Math.round(o.price)])});if(rows.length){books[bk.title||bk.key]=rows;n+=rows.length}})});
  if(!n){msg.textContent="No anytime-TD prices in that response. Check markets=player_anytime_td and oddsFormat=american.";return}
  var d=new Date();PASTE[g.gid]={at:d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+"T"+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2),b:books};ls("atd-paste",PASTE);IDX={};S.howOpen=false;render(true)}
var TEAMS={};[["Arizona Cardinals","ARI"],["Atlanta Falcons","ATL"],["Baltimore Ravens","BAL"],["Buffalo Bills","BUF"],["Carolina Panthers","CAR"],["Chicago Bears","CHI"],["Cincinnati Bengals","CIN"],["Cleveland Browns","CLE"],["Dallas Cowboys","DAL"],["Denver Broncos","DEN"],["Detroit Lions","DET"],["Green Bay Packers","GB"],["Houston Texans","HOU"],["Indianapolis Colts","IND"],["Jacksonville Jaguars","JAX"],["Kansas City Chiefs","KC"],["Las Vegas Raiders","LV"],["Los Angeles Chargers","LAC"],["Los Angeles Rams","LA"],["Miami Dolphins","MIA"],["Minnesota Vikings","MIN"],["New England Patriots","NE"],["New Orleans Saints","NO"],["New York Giants","NYG"],["New York Jets","NYJ"],["Philadelphia Eagles","PHI"],["Pittsburgh Steelers","PIT"],["San Francisco 49ers","SF"],["Seattle Seahawks","SEA"],["Tampa Bay Buccaneers","TB"],["Tennessee Titans","TEN"],["Washington Commanders","WAS"]].forEach(function(x){TEAMS[norm(x[0])]=x[1]});
/* chart tooltips */
document.addEventListener("pointermove",function(e){var t=e.target.closest&&e.target.closest("[data-tip]"),tip=$("tip");if(!t){tip.hidden=true;return}tip.textContent=t.getAttribute("data-tip");tip.hidden=false;tip.style.left=Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY+14)+"px"});
if(served){$("refreshBtn").hidden=false;$("refreshBtn").addEventListener("click",function(){say("Fetching games and prices.");post("/refresh","",this,"Refreshing…")})}
var hash=(location.hash||"").slice(1);if(V[hash])S.tab=hash;
function fail(){$("view").innerHTML='<section class="panel"><p class="empty">No data yet. On GitHub, open Actions, pick Update, and press Run workflow. The page fills in a few minutes later.</p></section>';$("fresh").textContent="Waiting for the first build"}
var inline=null;try{var raw=$("atd-data").textContent.trim();if(raw)inline=JSON.parse(raw)}catch(err){}
if(inline)start(inline);else fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(start).catch(fail);
if(!inline&&!served&&/^https?:$/.test(location.protocol))setInterval(function(){if(document.hidden)return;fetch("data.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&(!D||d.built!==D.built))start(d)}).catch(function(){})},600000);
})();
</script>
