   "<li><b>Chance.</b> Expected TDs go through one fitted curve with position and snap share: logistic("+w[0]+" + "+w[1]+" × ln(expected TDs) "+(w[2]<0?"− ":"+ ")+Math.abs(w[2])+" if QB + "+w[3]+" if RB + "+w[4]+" if TE + "+w[5]+" × snap share). Fitted on "+m.n.toLocaleString()+" player-games.</li>"+

  var tl={3:"1–5",8:"6–10",15:"11–20",30:"21–40",70:"41+"};

  h+='<section class="panel"><h2>What the price back-check found</h2><p class="note">334 games from 2025 through Week 4 of 2026, about 7,700 priced players, eight books, prices from an hour before kickoff. Chances came from a model that had not seen the season it was grading. The Tracker keeps these numbers current.</p><ol class="steps">'+
   "<li><b>The books are sharper than the model.</b> The median price predicts scorers better than the model does on its own (log loss 0.402 against 0.411). The model adds a little on top of the price, not the other way round.</li>"+
   "<li><b>Betting every model edge does not pay.</b> All bets with an edge above 3%: about −1% per bet. Edges above 25% lose (about −5%), because a price that far from the model usually reflects news.</li>"+
   "<li><b>The zone that held up:</b> chance 20%+ with an edge of 3% to 25%. about 700 bets, about +7% per bet, positive in each third of the sample (+2%, +7%, +26%). Resampling by week puts the chance that this is truly profitable near 93%, so it is promising, not proven.</li>"+
   "<li><b>It only works with line shopping.</b> The same rule at the best of eight books: +7%. At DraftKings alone: −2%. At FanDuel alone: 0%. At the median price: +1%.</li>"+
