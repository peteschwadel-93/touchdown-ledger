name: Update

on:
  schedule:
    # every 15 minutes around games (times are UTC; ET is 4 or 5 hours behind)
    - cron: "*/15 10-13 * * 0"          # Sunday morning: London games and the run-up to 1:00
    - cron: "*/15 14-23 * * 0,1,4,6"    # Sunday, Monday, Thursday, Saturday: late morning to evening ET
    - cron: "*/15 0-4 * * 0,1,2,5"      # the same nights after midnight UTC: evening games through the final whistle
    - cron: "7 * * * *"                 # hourly the rest of the time, for lines, injuries and results
  workflow_dispatch:
    inputs:
      past_prices:
        description: "Load past prices for finished games (paid Odds API plan, 10 requests per game)"
        type: choice
        default: "no"
        options: ["no", "this season", "this season and last season", "this season first TD"]
  push:
    branches: [main]
    paths: ["index.html", "build_data.py", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: nfl_cache
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-
      - name: Build data and pull prices
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BACKFILL: ${{ inputs.past_prices == 'this season' && '1' || inputs.past_prices == 'this season and last season' && '2' || inputs.past_prices == 'this season first TD' && '3' || '' }}
        run: python build_data.py --out data.json
      - name: Keep the price record
        run: |
          if [ -f odds.json ] && [ -n "$(git status --porcelain odds.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add odds.json
            git commit -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html data.json _site/
          if [ -d "NFL Logos" ]; then cp -r "NFL Logos" _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
